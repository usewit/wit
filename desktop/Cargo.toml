[package]
name = "wit-desktop"
license = "MIT"
version = "0.1.0"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
axum = "0.8"
wit = { path = ".." }
