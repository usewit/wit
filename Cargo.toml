[package]
name = "wit"
license = "MIT"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
comemo = "0.5.1"
imagesize = "0.15.0"
pulldown-cmark = "0.13.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
tokio = { version = "1.53.2", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
typst = "0.15.1"
typst-kit = { version = "0.15.1", default-features = false, features = ["scan-fonts", "embedded-fonts"] }
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
typst-render = "0.15.1"
zip = { version = "9.0.2", default-features = false, features = ["deflate"] }

[workspace]
members = ["desktop"]

[profile.release]
strip = true
