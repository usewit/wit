# Build the macOS app: a universal (Apple Silicon + Intel) Wit.app in a .dmg.
# Runs by hand (Actions → macOS → Run workflow) or from the Release workflow
# on a version tag, not on every push: macOS minutes are expensive on a
# private repo.
#
# Signing and notarization switch on when these repository secrets exist;
# without them the app is ad-hoc signed (opens with right-click → Open).
#   APPLE_CERTIFICATE           Developer ID Application .p12, base64
#   APPLE_CERTIFICATE_PASSWORD  the .p12 password
#   APPLE_SIGNING_IDENTITY      optional: "Developer ID Application: Name (TEAMID)";
#                               found in the certificate when left out
# Notarization, with an Apple ID (as micropage's CLI does):
#   APPLE_ID                    the Apple ID email
#   APPLE_PASSWORD              an app-specific password for it
#   APPLE_TEAM_ID               the 10-character team ID
# or the API key (used instead when both are set):
#   APPLE_API_KEY               the key ID
#   APPLE_API_ISSUER            the issuer ID
#   APPLE_API_KEY_P8            the .p8 key file's contents
name: macOS

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the web app
        working-directory: web
        run: npm ci && npm run build

      - name: Signing setup
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "Signing with the Developer ID certificate."
          else
            echo "No certificate secret: ad-hoc signing only, no notarization."
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_API_KEY_P8" ]; then
            key="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$key"
            echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"
          fi

      - name: Build Wit.app and the .dmg
        working-directory: desktop
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          ID: ${{ secrets.APPLE_ID }}
          ID_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Tauri acts on these as soon as they exist, even empty, so a
          # missing secret must leave its variable unset.
          if [ -n "$CERT" ]; then
            export APPLE_CERTIFICATE="$CERT" APPLE_CERTIFICATE_PASSWORD="$CERT_PASSWORD"
            if [ -n "$IDENTITY" ]; then export APPLE_SIGNING_IDENTITY="$IDENTITY"; fi
            # An API key wins over an Apple ID when both are set.
            if [ -n "$API_KEY" ] && [ -n "${APPLE_API_KEY_PATH:-}" ]; then
              export APPLE_API_KEY="$API_KEY" APPLE_API_ISSUER="$API_ISSUER"
            elif [ -n "$ID" ]; then
              export APPLE_ID="$ID" APPLE_PASSWORD="$ID_PASSWORD" APPLE_TEAM_ID="$TEAM_ID"
            fi
          fi
          # The web app is already built above.
          npx -y @tauri-apps/cli@2 build --target universal-apple-darwin \
            --config '{"build":{"beforeBuildCommand":""}}'

      - uses: actions/upload-artifact@v4
        with:
          name: Wit-macOS
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
