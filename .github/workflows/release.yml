# Make a release from a version tag: push v0.2.0 and this builds Linux and
# macOS, then opens a draft GitHub release with every file attached. Check
# it, then press Publish on the release page.
# The tag must match "version" in desktop/tauri.conf.json, since the files
# are named after it (Wit_0.2.0_amd64.deb).
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the app version
        run: |
          version=$(jq -r .version desktop/tauri.conf.json)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in desktop/tauri.conf.json"
            exit 1
          fi

  linux:
    needs: check
    uses: ./.github/workflows/linux.yml

  macos:
    needs: check
    uses: ./.github/workflows/macos.yml
    secrets: inherit

  release:
    needs: [linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The Linux files arrive in appimage/, deb/ and rpm/ subfolders.
          mapfile -t files < <(find dist -type f)
          printf '%s\n' "${files[@]}"
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" --draft --generate-notes \
            --title "Wit ${GITHUB_REF_NAME#v}"
